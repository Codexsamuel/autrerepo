version: '3.8'

services:
  # Base de données PostgreSQL ultra-sécurisée
  nova-database:
    image: postgres:15-alpine
    container_name: nova-ia-database
    environment:
      POSTGRES_DB: nova_ia_commercial
      POSTGRES_USER: nova_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-NOVA_IA_SUPER_SECURE_PASSWORD_4096}
    volumes:
      - nova_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - nova-network

  # Redis pour le cache et les sessions
  nova-redis:
    image: redis:7-alpine
    container_name: nova-ia-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-NOVA_IA_REDIS_SECURE_2025}
    volumes:
      - nova_redis_data:/data
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - nova-network

  # Elasticsearch pour la recherche et l'analyse
  nova-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: nova-ia-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-NOVA_IA_ELASTIC_SECURE_2025}
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - nova_elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9201:9200"
      - "9301:9300"
    restart: unless-stopped
    networks:
      - nova-network

  # Kibana pour la visualisation des données
  nova-kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: nova-ia-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://nova-elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-NOVA_IA_ELASTIC_SECURE_2025}
    ports:
      - "5602:5601"
    depends_on:
      - nova-elasticsearch
    restart: unless-stopped
    networks:
      - nova-network

  # Backend NovaAgent AI Commercial ultra-avancé
  nova-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: nova-ia-backend
    ports:
      - "8001:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://nova_admin:${DB_PASSWORD:-NOVA_IA_SUPER_SECURE_PASSWORD_4096}@nova-database:5432/nova_ia_commercial
      - REDIS_URL=redis://:${REDIS_PASSWORD:-NOVA_IA_REDIS_SECURE_2025}@nova-redis:6379/0
      - ELASTICSEARCH_URL=http://elastic:${ELASTIC_PASSWORD:-NOVA_IA_ELASTIC_SECURE_2025}@nova-elasticsearch:9200
      - JWT_SECRET=${JWT_SECRET:-NOVA_IA_JWT_SUPER_SECURE_2025}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-NOVA_IA_ENCRYPTION_KEY_256_BIT_2025}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
      - ./modules:/app/modules
      - ./config:/app/config
    depends_on:
      - nova-database
      - nova-redis
      - nova-elasticsearch
    restart: unless-stopped
    networks:
      - nova-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Frontend NovaAgent AI Commercial ultra-avancé
  nova-frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nova-ia-frontend
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_WEBSOCKET_URL=ws://localhost:8001/ws
      - NEXT_PUBLIC_ELASTICSEARCH_URL=http://localhost:9201
      - NEXT_PUBLIC_KIBANA_URL=http://localhost:5602
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - nova-backend
    restart: unless-stopped
    networks:
      - nova-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Nginx reverse proxy avec SSL
  nova-nginx:
    image: nginx:alpine
    container_name: nova-ia-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - nova-frontend
      - nova-backend
    restart: unless-stopped
    networks:
      - nova-network

  # Monitoring avec Prometheus
  nova-prometheus:
    image: prom/prometheus:latest
    container_name: nova-ia-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - nova_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - nova-network

  # Grafana pour la visualisation
  nova-grafana:
    image: grafana/grafana:latest
    container_name: nova-ia-grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-NOVA_IA_GRAFANA_SECURE_2025}
    volumes:
      - nova_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - nova-prometheus
    restart: unless-stopped
    networks:
      - nova-network

  # Module AI Influence Scanner
  nova-influence-scanner:
    build: 
      context: ./modules/ai_influence_scanner
      dockerfile: Dockerfile
    container_name: nova-ia-influence-scanner
    environment:
      - DATABASE_URL=postgresql://nova_admin:${DB_PASSWORD}@nova-database:5432/nova_ia_commercial
      - REDIS_URL=redis://:${REDIS_PASSWORD}@nova-redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./modules/ai_influence_scanner:/app
      - ./logs:/app/logs
    depends_on:
      - nova-database
      - nova-redis
    restart: unless-stopped
    networks:
      - nova-network

  # Module Predictive Trend Model
  nova-predictive-trend:
    build: 
      context: ./modules/predictive_trend_model
      dockerfile: Dockerfile
    container_name: nova-ia-predictive-trend
    environment:
      - DATABASE_URL=postgresql://nova_admin:${DB_PASSWORD}@nova-database:5432/nova_ia_commercial
      - REDIS_URL=redis://:${REDIS_PASSWORD}@nova-redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./modules/predictive_trend_model:/app
      - ./logs:/app/logs
    depends_on:
      - nova-database
      - nova-redis
    restart: unless-stopped
    networks:
      - nova-network

  # Module Sovereign AI Counter Algorithm
  nova-sovereign-ai:
    build: 
      context: ./modules/sovereign_ai_counter_algorithm
      dockerfile: Dockerfile
    container_name: nova-ia-sovereign-ai
    environment:
      - DATABASE_URL=postgresql://nova_admin:${DB_PASSWORD}@nova-database:5432/nova_ia_commercial
      - REDIS_URL=redis://:${REDIS_PASSWORD}@nova-redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./modules/sovereign_ai_counter_algorithm:/app
      - ./logs:/app/logs
    depends_on:
      - nova-database
      - nova-redis
    restart: unless-stopped
    networks:
      - nova-network

  # Module Intelligent Social Manager
  nova-social-manager:
    build: 
      context: ./modules/intelligent_social_manager
      dockerfile: Dockerfile
    container_name: nova-ia-social-manager
    environment:
      - DATABASE_URL=postgresql://nova_admin:${DB_PASSWORD}@nova-database:5432/nova_ia_commercial
      - REDIS_URL=redis://:${REDIS_PASSWORD}@nova-redis:6379/0
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
    volumes:
      - ./modules/intelligent_social_manager:/app
      - ./logs:/app/logs
    depends_on:
      - nova-database
      - nova-redis
    restart: unless-stopped
    networks:
      - nova-network

  # Module AI Content Generator
  nova-content-generator:
    build: 
      context: ./modules/ai_content_generator
      dockerfile: Dockerfile
    container_name: nova-ia-content-generator
    environment:
      - DATABASE_URL=postgresql://nova_admin:${DB_PASSWORD}@nova-database:5432/nova_ia_commercial
      - REDIS_URL=redis://:${REDIS_PASSWORD}@nova-redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./modules/ai_content_generator:/app
      - ./logs:/app/logs
    depends_on:
      - nova-database
      - nova-redis
    restart: unless-stopped
    networks:
      - nova-network

  # Module Security Controller
  nova-security-controller:
    build: 
      context: ./modules/security_controller
      dockerfile: Dockerfile
    container_name: nova-ia-security-controller
    environment:
      - DATABASE_URL=postgresql://nova_admin:${DB_PASSWORD}@nova-database:5432/nova_ia_commercial
      - REDIS_URL=redis://:${REDIS_PASSWORD}@nova-redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    volumes:
      - ./modules/security_controller:/app
      - ./logs:/app/logs
    depends_on:
      - nova-database
      - nova-redis
    restart: unless-stopped
    networks:
      - nova-network

volumes:
  nova_data:
    driver: local
  nova_redis_data:
    driver: local
  nova_elasticsearch_data:
    driver: local
  nova_prometheus_data:
    driver: local
  nova_grafana_data:
    driver: local

networks:
  nova-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
