[build]
  command = "npm run build:netlify:ultra-simple-fix"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY = "true"
  USE_EMERGENCY_BUILD = "true"

[[redirects]]
  from = "/api/novaprotect/*"
  to = "/api/status"
  status = 200

[[redirects]]
  from = "/api/ics/*"
  to = "/api/status"
  status = 200

[[redirects]]
  from = "/api/search/*"
  to = "/api/status"
  status = 200

[[redirects]]
  from = "/api/reminders/*"
  to = "/api/status"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin" 