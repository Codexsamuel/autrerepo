---
# Network Policy pour SOAR (orchestration de réponse)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-soar-network-policy
  namespace: sentinel-zero
  labels:
    app: sentinel-soar
    security: critical
spec:
  podSelector:
    matchLabels:
      app: sentinel-soar
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Accès depuis NovaBot
  - from:
    - podSelector:
        matchLabels:
          app: novabot
    ports:
    - protocol: TCP
      port: 8003
  # Accès depuis Sentinel Core
  - from:
    - podSelector:
        matchLabels:
          app: sentinel-core
    ports:
    - protocol: TCP
      port: 8003
  egress:
  # Accès à la base de données
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-database
    ports:
    - protocol: TCP
      port: 5432
  # Accès à Redis
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-redis
    ports:
    - protocol: TCP
      port: 6379
  # Accès aux APIs externes (firewall, EDR, WAF)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
# Network Policy pour Ingestion (capteurs)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-ingestion-network-policy
  namespace: sentinel-zero
  labels:
    app: sentinel-ingestion
    security: high
spec:
  podSelector:
    matchLabels:
      app: sentinel-ingestion
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Accès depuis NovaBot
  - from:
    - podSelector:
        matchLabels:
          app: novabot
    ports:
    - protocol: TCP
      port: 8004
  egress:
  # Accès à Kafka
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-kafka
    ports:
    - protocol: TCP
      port: 9092
  # Accès à la base de données
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-database
    ports:
    - protocol: TCP
      port: 5432
  # Accès aux sources externes (logs, SIEM, etc.)
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 514  # Syslog
    - protocol: TCP
      port: 6514 # Syslog over TLS

