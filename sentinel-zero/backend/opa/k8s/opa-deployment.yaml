apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: opa-system
  labels:
    app: opa
    component: security
    security: high
    environment: production
    role: policy-enforcer
  annotations:
    security_level: high
    isolation_level: strict
    audit_enabled: "true"
    log_level: info
    gdpr_compliant: "true"
    disaster_recovery_plan: "dr-plan-001"
    backup_schedule: "daily"
    encryption_at_rest: "true"
    rate_limit_enabled: "true"
    approval_required: "false"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: opa
  template:
    metadata:
      labels:
        app: opa
        component: security
        security: high
        environment: production
        role: policy-enforcer
      annotations:
        security_level: high
        isolation_level: strict
        audit_enabled: "true"
        log_level: info
        gdpr_compliant: "true"
        disaster_recovery_plan: "dr-plan-001"
        backup_schedule: "daily"
        encryption_at_rest: "true"
        rate_limit_enabled: "true"
        approval_required: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 3000
      serviceAccountName: opa
      containers:
      - name: opa
        image: openpolicyagent/opa:latest
        imagePullPolicy: Always
        args:
        - "run"
        - "--server"
        - "--addr=:8181"
        - "--addr=:8182"
        - "--config-file=/config/opa-config.yaml"
        - "--log-level=info"
        - "--log-format=json"
        ports:
        - name: http
          containerPort: 8181
          protocol: TCP
        - name: https
          containerPort: 8182
          protocol: TCP
        - name: metrics
          containerPort: 8183
          protocol: TCP
        resources:
          limits:
            cpu: "1000m"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          runAsUser: 1000
          runAsGroup: 3000
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /health?bundle=true
            port: 8181
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health?bundle=true
            port: 8181
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: opa-config
          mountPath: /config
          readOnly: true
        - name: opa-policies
          mountPath: /policies
          readOnly: true
        - name: opa-cache
          mountPath: /cache
        env:
        - name: OPA_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: opa-secrets
              key: bearer-token
        - name: OPA_LOG_LEVEL
          value: "info"
        - name: OPA_LOG_FORMAT
          value: "json"
        - name: OPA_METRICS
          value: "true"
        - name: OPA_DECISION_LOGS
          value: "true"
        - name: OPA_STATUS
          value: "true"
      volumes:
      - name: opa-config
        configMap:
          name: opa-config
      - name: opa-policies
        configMap:
          name: opa-policies
      - name: opa-cache
        emptyDir: {}
      nodeSelector:
        security: high
      tolerations:
      - key: security
        operator: Equal
        value: high
        effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: security
                operator: In
                values:
                - high
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - opa
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: opa
  namespace: opa-system
  labels:
    app: opa
    component: security
    security: high
    environment: production
    role: policy-enforcer
  annotations:
    security_level: high
    audit_enabled: "true"
    log_level: info
spec:
  selector:
    app: opa
  ports:
  - name: http
    port: 8181
    targetPort: 8181
    protocol: TCP
  - name: https
    port: 8182
    targetPort: 8182
    protocol: TCP
  - name: metrics
    port: 8183
    targetPort: 8183
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: opa-system
  labels:
    app: opa
    component: security
    security: high
    environment: production
    role: policy-enforcer
  annotations:
    security_level: high
    audit_enabled: "true"
    log_level: info
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opa-policy-enforcer
  labels:
    app: opa
    component: security
    security: high
    environment: production
    role: policy-enforcer
  annotations:
    security_level: high
    audit_enabled: "true"
    log_level: info
rules:
- apiGroups: [""]
  resources: ["pods", "services", "secrets", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["admission.k8s.io"]
  resources: ["admissionreviews"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opa-policy-enforcer
  labels:
    app: opa
    component: security
    security: high
    environment: production
    role: policy-enforcer
  annotations:
    security_level: high
    audit_enabled: "true"
    log_level: info
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opa-policy-enforcer
subjects:
- kind: ServiceAccount
  name: opa
  namespace: opa-system 