version: '3.8'

services:
  sentinel-backend:
    build: ./backend
    container_name: sentinel-zero-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - MASTER_CODE=${MASTER_CODE}
      - BIOMETRIC_VOICE_HASH=${BIOMETRIC_VOICE_HASH}
      - BIOMETRIC_FP_HASH=${BIOMETRIC_FP_HASH}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID}
      - RED_BUTTON_PHRASE=${RED_BUTTON_PHRASE}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-frontend:
    build: ./frontend
    container_name: sentinel-zero-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - sentinel-backend
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-database:
    image: postgres:15
    container_name: sentinel-zero-database
    environment:
      - POSTGRES_DB=sentinel_zero
      - POSTGRES_USER=sentinel_admin
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - sentinel_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-redis:
    image: redis:7-alpine
    container_name: sentinel-zero-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - sentinel_redis:/data
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: sentinel-zero-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - sentinel_elastic:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: sentinel-zero-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://sentinel-elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - sentinel-elasticsearch
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-grafana:
    image: grafana/grafana:10.2.0
    container_name: sentinel-zero-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    ports:
      - "3001:3000"
    volumes:
      - sentinel_grafana:/var/lib/grafana
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-zero-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - sentinel_prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - sentinel-network

  sentinel-nginx:
    image: nginx:alpine
    container_name: sentinel-zero-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
      - ./config/ssl:/etc/nginx/ssl
    depends_on:
      - sentinel-frontend
      - sentinel-backend
    restart: unless-stopped
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  sentinel_data:
  sentinel_redis:
  sentinel_elastic:
  sentinel_grafana:
  sentinel_prometheus:
