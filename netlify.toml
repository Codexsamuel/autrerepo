[build]
  command = "npm run build:netlify"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_ENV = "production"

# Configuration DNS pour les domaines personnalisés
[[redirects]]
  from = "https://dlsolutionssarl.tech/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dlsolutionssarl.tech/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://daveandlucesolutions.com/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.daveandlucesolutions.com/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

# Redirection pour le frontend
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuration des en-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview.environment]
  NODE_ENV = "preview"

[context.branch-deploy.environment]
  NODE_ENV = "development" 