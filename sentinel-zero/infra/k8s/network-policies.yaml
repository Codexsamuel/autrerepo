# === NETWORK POLICIES SENTINEL ZERO ===
# Isolation réseau et sécurité des communications

---
# Network Policy pour NovaBot (orchestrateur)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: novabot-network-policy
  namespace: sentinel-zero
  labels:
    app: novabot
    security: high
spec:
  podSelector:
    matchLabels:
      app: novabot
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Accès depuis l'extérieur (API)
  - from:
    - namespaceSelector:
        matchLabels:
          name: sentinel-zero
    ports:
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 443
  # Accès depuis le frontend
  - from:
    - podSelector:
        matchLabels:
          app: sentinel-frontend
    ports:
    - protocol: TCP
      port: 8001
  egress:
  # Accès à la base de données
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-database
    ports:
    - protocol: TCP
      port: 5432
  # Accès à Redis
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-redis
    ports:
    - protocol: TCP
      port: 6379
  # Accès à Elasticsearch
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-elasticsearch
    ports:
    - protocol: TCP
      port: 9200
  # Accès à la Vector DB
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-vector-db
    ports:
    - protocol: TCP
      port: 5432

