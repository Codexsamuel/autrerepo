version: "3.9"

x-env: &default-env
  POSTGRES_USER: nova
  POSTGRES_PASSWORD: nova
  POSTGRES_DB: nova
  REDIS_URL: redis://redis:6379
  NODE_ENV: development

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *default-env
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama pour modèles locaux (LLM/embeddings)
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports: ["11434:11434"]
    volumes:
      - ollama_data:/root/.ollama
      - ./models:/models
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    # Profil CUDA (NVIDIA) - COMMENTEZ SI CPU UNIQUEMENT
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API FastAPI pour agents (RAG, embeddings, judge)
  agents-api:
    build:
      context: ./services/agents-api
      dockerfile: ../docker/agents-api.Dockerfile
    environment:
      <<: *default-env
      OLLAMA_HOST: http://ollama:11434
      VECTOR_DB_PATH: /data/faiss
      LOG_LEVEL: INFO
      MAX_WORKERS: 4
    volumes:
      - faiss_data:/data/faiss
      - ./datasets:/app/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API NestJS pour contrôle (RBAC, WebSocket, orchestration)
  control-api:
    build:
      context: ./services/control-api
      dockerfile: ../docker/control-api.Dockerfile
    environment:
      <<: *default-env
      CONTROL_WS_PUBLIC: ws://localhost:4001
      JWT_SECRET: novaia-super-secret-key-change-in-production
      DATABASE_URL: postgresql://nova:nova@postgres:5432/nova
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports: ["4000:4000", "4001:4001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Marketplace Next.js
  marketplace:
    build:
      context: ./apps/marketplace
      dockerfile: ../docker/marketplace.Dockerfile
    environment:
      <<: *default-env
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_AGENTS_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    volumes: ["./apps/marketplace:/app", "/app/node_modules", "/app/.next"]
    ports: ["3000:3000"]
    depends_on:
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # NovaCore Next.js (monitoring & gouvernance)
  novacore:
    build:
      context: ./apps/novacore
      dockerfile: ../docker/novacore.Dockerfile
    environment:
      <<: *default-env
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_AGENTS_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    volumes: ["./apps/novacore:/app", "/app/node_modules", "/app/.next"]
    ports: ["3001:3001"]
    depends_on:
      agents-api:
        condition: service_healthy
      control-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Battle Arena Next.js (ELO, datasets, classements)
  battle-arena:
    build:
      context: ./apps/battle-arena
      dockerfile: ../docker/battle-arena.Dockerfile
    environment:
      <<: *default-env
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_AGENTS_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    volumes: ["./apps/battle-arena:/app", "/app/node_modules", "/app/.next"]
    ports: ["3002:3002"]
    depends_on:
      agents-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Agent Lab Next.js (AgentGenesis: DSL→code)
  agent-lab:
    build:
      context: ./apps/agent-lab
      dockerfile: ../docker/agent-lab.Dockerfile
    environment:
      <<: *default-env
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_AGENTS_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:4001
    volumes: ["./apps/agent-lab:/app", "/app/node_modules", "/app/.next"]
    ports: ["3003:3003"]
    depends_on:
      control-api:
        condition: service_healthy
      agents-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx reverse proxy (optionnel)
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - marketplace
      - novacore
      - battle-arena
      - agent-lab
    profiles: ["production"]

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  ollama_data:
    driver: local
  faiss_data:
    driver: local

networks:
  default:
    name: novaia-network
    driver: bridge
