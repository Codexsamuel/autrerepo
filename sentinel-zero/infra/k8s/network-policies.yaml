---
# Network Policy pour Intelligence (OSINT)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-intel-network-policy
  namespace: sentinel-zero
  labels:
    app: sentinel-intel
    security: medium
spec:
  podSelector:
    matchLabels:
      app: sentinel-intel
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Accès depuis NovaBot
  - from:
    - podSelector:
        matchLabels:
          app: novabot
    ports:
    - protocol: TCP
      port: 8006
  egress:
  # Accès à la base de données
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-database
    ports:
    - protocol: TCP
      port: 5432
  # Accès aux sources OSINT externes
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  # Accès au proxy (si configuré)
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-proxy
    ports:
    - protocol: TCP
      port: 8080

---
# Network Policy pour Sandbox (analyse isolée)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sentinel-sandbox-network-policy
  namespace: sentinel-sandbox
  labels:
    app: sentinel-sandbox
    security: critical
    isolation: air-gapped
spec:
  podSelector:
    matchLabels:
      app: sentinel-sandbox
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Accès depuis NovaBot (limité)
  - from:
    - namespaceSelector:
        matchLabels:
          name: sentinel-zero
    ports:
    - protocol: TCP
      port: 8007
  egress:
  # Accès UNIQUEMENT à la base de données
  - to:
    - podSelector:
        matchLabels:
          app: sentinel-database
    ports:
    - protocol: TCP
      port: 5432
  # AUCUN accès réseau externe
  # AUCUN accès aux autres services

