version: "3.8"

services:
  # Service principal hybride
  app:
    build: .
    ports:
      - "3000:3000" # Frontend Next.js
      - "8000:8000" # Backend Python
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app/backend
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - app-network

  # Base de données (optionnelle)
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: novacore
      POSTGRES_USER: novacore_user
      POSTGRES_PASSWORD: novacore_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    restart: unless-stopped

  # Redis pour le cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: unless-stopped

  # Nginx pour le reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge
