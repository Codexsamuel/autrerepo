# 🔐 Configuration Sentinel Zero - Chiffrée avec SOPS
# Déchiffrer avec: sops -d .env.sops.yaml > .env

# OpenAI Configuration
OPENAI_API_KEY: ENC[AES256_GCM,data:...,type:str]
OPENAI_MODEL: gpt-4o
OPENAI_TEMPERATURE: 0

# Supabase Configuration
SUPABASE_URL: ENC[AES256_GCM,data:...,type:str]
SUPABASE_KEY: ENC[AES256_GCM,data:...,type:str]
SUPABASE_SERVICE_ROLE_KEY: ENC[AES256_GCM,data:...,type:str]

# ElevenLabs Configuration
ELEVENLABS_API_KEY: ENC[AES256_GCM,data:...,type:str]
ELEVENLABS_VOICE_ID: ENC[AES256_GCM,data:...,type:str]

# Sentinel Zero Configuration
SENTINEL_MODE: defensive
SENTINEL_LOG_LEVEL: info
SENTINEL_AUTO_RESPONSE: true
SENTINEL_RED_BUTTON_ENABLED: true

# Network Configuration
NETWORK_TIMEOUT: 30
NETWORK_RETRY_ATTEMPTS: 3
NETWORK_MAX_CONNECTIONS: 100

# Security Configuration
SECURITY_ENCRYPTION_KEY: ENC[AES256_GCM,data:...,type:str]
SECURITY_JWT_SECRET: ENC[AES256_GCM,data:...,type:str]
SECURITY_SESSION_TIMEOUT: 3600

# Monitoring Configuration
MONITORING_ENABLED: true
MONITORING_INTERVAL: 60
MONITORING_ALERT_THRESHOLD: 80
