    create: "Création de nouveaux utilisateurs"
    update: "Modification des profils"
    delete: "Suppression d'utilisateurs"
    impersonate: "Usurpation d'identité"
    
  # Agents IA
  agents:
    read: "Lecture des informations d'agents"
    create: "Création de nouveaux agents"
    update: "Modification d'agents existants"
    delete: "Suppression d'agents"
    run: "Exécution d'agents"
    test: "Test d'agents"
    publish: "Publication d'agents"
    deploy_production: "Déploiement en production"
    
  # Flotte
