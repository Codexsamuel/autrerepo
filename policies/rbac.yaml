    read: "Lecture du statut de la flotte"
    monitor: "Surveillance de la flotte"
    control: "Contrôle de la flotte"
    scale: "Mise à l'échelle"
    update: "Mise à jour de la flotte"
    
  # Datasets
  datasets:
    read: "Lecture des datasets"
    create: "Création de datasets"
    update: "Modification de datasets"
    delete: "Suppression de datasets"
    analyze: "Analyse des datasets"
    export: "Export des datasets"
    
  # Marketplace
  marketplace:
    read: "Lecture du catalogue"
    install: "Installation d'agents"
    publish: "Publication d'agents"
    review: "Évaluation d'agents"
    
  # Outils
  tools:
    read: "Lecture des outils disponibles"
    use: "Utilisation des outils"
    create: "Création d'outils"
    update: "Modification d'outils"
    
  # RAG
  rag:
    query: "Requêtes RAG"
    index: "Indexation de documents"
    search: "Recherche vectorielle"
    
  # Embeddings
  embeddings:
    create: "Création d'embeddings"
    query: "Requêtes d'embeddings"
    store: "Stockage d'embeddings"
    
  # Monitoring
  monitoring:
    read: "Lecture des métriques"
    metrics: "Accès aux métriques détaillées"
    alerts: "Gestion des alertes"
    security: "Monitoring de sécurité"
    
  # Politiques
  policies:
    read: "Lecture des politiques"
    create: "Création de politiques"
    update: "Modification de politiques"
    delete: "Suppression de politiques"
    
  # Sécurité
  security:
    audit: "Audit de sécurité"
    encryption: "Gestion du chiffrement"
    compliance: "Conformité"
    access_control: "Contrôle d'accès"
    
  # Audit
  audit:
    read: "Lecture des logs d'audit"
    export: "Export des logs"
    delete: "Suppression des logs"
    
  # Facturation
  billing:
    read: "Lecture des factures"
    create: "Création de factures"
    update: "Modification de factures"
    delete: "Suppression de factures"
    
  # Rapports
  reports:
    read: "Lecture des rapports"
    create: "Création de rapports"
    update: "Modification de rapports"
    delete: "Suppression de rapports"
    
  # Tableaux de bord
  dashboards:
    read: "Lecture des tableaux de bord"
    create: "Création de tableaux de bord"
    update: "Modification de tableaux de bord"
    delete: "Suppression de tableaux de bord"
    
  # Documentation
  documentation:
    read: "Lecture de la documentation"
    create: "Création de documentation"
    update: "Modification de documentation"
    delete: "Suppression de documentation"
    
  # Aide
  help:
    read: "Accès à l'aide"
    create: "Création de tickets d'aide"
    update: "Mise à jour de tickets"
    
  # Statut
  status:
    read: "Lecture du statut des services"
    
  # Playbooks
  playbooks:
    read: "Lecture des playbooks"
    run: "Exécution de playbooks"
    create: "Création de playbooks"
    update: "Modification de playbooks"
    
  # Analytics
  analytics:
    read: "Lecture des analyses"
    create: "Création d'analyses"
    update: "Modification d'analyses"
    
  # Visualisations
  visualizations:
    create: "Création de visualisations"
    update: "Modification de visualisations"
    delete: "Suppression de visualisations"
    
  # Secrets
  secrets:
    read: "Lecture des secrets"
    create: "Création de secrets"
    update: "Modification de secrets"
    delete: "Suppression de secrets"
    
  # Blueprints
  blueprints:
    read: "Lecture des blueprints"
    create: "Création de blueprints"
    update: "Modification de blueprints"
    delete: "Suppression de blueprints"

# Règles de résolution des conflits
conflict_resolution:
  # En cas de conflit entre allow et deny, deny l'emporte
  deny_overrides_allow: true
  
  # Les permissions héritées peuvent être surchargées
  inheritance_override: true
  
  # Vérification stricte des permissions
  strict_mode: true 