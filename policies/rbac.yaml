# =============================================================================
# NOVAIA - Politiques RBAC (Role-Based Access Control)
# =============================================================================

# Définition des rôles et leurs permissions
roles:
  # Super administrateur - Accès complet
  super_admin:
    name: "Super Administrateur"
    description: "Accès complet à toutes les fonctionnalités"
    allow: ["*"]
    deny: []
    inherits: []
    
  # Administrateur système
  system_admin:
    name: "Administrateur Système"
    description: "Gestion complète du système et des utilisateurs"
    allow:
      - "system:*"
      - "users:*"
      - "policies:*"
      - "monitoring:*"
      - "agents:*"
      - "fleet:*"
      - "datasets:*"
      - "marketplace:*"
    deny:
      - "billing:delete"
      - "audit:delete"
    inherits: ["operator", "viewer"]
    
  # Administrateur de sécurité
  security_admin:
    name: "Administrateur Sécurité"
    description: "Gestion de la sécurité et conformité"
    allow:
      - "security:*"
      - "policies:*"
      - "audit:*"
      - "compliance:*"
      - "encryption:*"
      - "monitoring:security"
    deny: []
    inherits: ["viewer"]
    
  # Opérateur - Utilisateur avancé
  operator:
    name: "Opérateur"
    description: "Utilisateur avancé avec accès aux agents et outils"
    allow:
      - "agents:read"
      - "agents:run"
      - "agents:create"
      - "agents:update"
      - "agents:delete"
      - "fleet:read"
      - "fleet:monitor"
      - "fleet:control"
      - "datasets:read"
      - "datasets:create"
      - "datasets:update"
      - "marketplace:read"
      - "marketplace:install"
      - "tools:use"
      - "rag:query"
      - "embeddings:create"
      - "playbooks:run"
      - "monitoring:read"
      - "monitoring:metrics"
    deny:
      - "secrets:*"
      - "policies:*"
      - "system:*"
      - "users:*"
      - "billing:*"
    inherits: ["viewer"]
    
  # Développeur d'agents
  agent_developer:
    name: "Développeur d'Agents"
    description: "Création et modification d'agents IA"
    allow:
      - "agents:read"
      - "agents:create"
      - "agents:update"
      - "agents:test"
      - "agents:publish"
      - "blueprints:read"
      - "blueprints:create"
      - "blueprints:update"
      - "tools:read"
      - "tools:use"
      - "datasets:read"
      - "datasets:create"
      - "marketplace:read"
      - "marketplace:publish"
    deny:
      - "agents:delete"
      - "agents:deploy_production"
      - "secrets:*"
      - "policies:*"
    inherits: ["viewer"]
    
  # Analyste de données
  data_analyst:
    name: "Analyste de Données"
    description: "Analyse et exploration des données"
    allow:
      - "datasets:read"
      - "datasets:create"
      - "datasets:update"
      - "datasets:analyze"
      - "rag:query"
      - "embeddings:create"
      - "embeddings:query"
      - "analytics:read"
      - "analytics:create"
      - "visualizations:create"
      - "agents:read"
      - "agents:run"
    deny:
      - "datasets:delete"
      - "secrets:*"
      - "policies:*"
    inherits: ["viewer"]
    
  # Utilisateur business
  business_user:
    name: "Utilisateur Business"
    description: "Utilisation des agents pour tâches métier"
    allow:
      - "agents:read"
      - "agents:run"
      - "marketplace:read"
      - "marketplace:install"
      - "rag:query"
      - "tools:use"
      - "reports:read"
      - "reports:create"
      - "dashboards:read"
    deny:
      - "agents:create"
      - "agents:update"
      - "agents:delete"
      - "datasets:create"
      - "datasets:update"
      - "datasets:delete"
      - "secrets:*"
      - "policies:*"
    inherits: ["viewer"]
    
  # Lecteur - Accès en lecture seule
  viewer:
    name: "Lecteur"
    description: "Accès en lecture seule aux ressources publiques"
    allow:
      - "dashboards:read"
      - "agents:read"
      - "marketplace:read"
      - "documentation:read"
      - "help:read"
      - "status:read"
    deny:
      - "agents:run"
      - "agents:create"
      - "agents:update"
      - "agents:delete"
      - "datasets:*"
      - "tools:*"
      - "secrets:*"
      - "policies:*"
      - "system:*"
      - "users:*"
      - "billing:*"
    inherits: []
    
  # Invité - Accès limité
  guest:
    name: "Invité"
    description: "Accès très limité pour démonstration"
    allow:
      - "marketplace:read"
      - "documentation:read"
      - "help:read"
      - "status:read"
    deny:
      - "agents:*"
      - "datasets:*"
      - "tools:*"
      - "secrets:*"
      - "policies:*"
      - "system:*"
      - "users:*"
      - "billing:*"
      - "monitoring:*"
    inherits: []

