[build]
  command = "npm run build:netlify:compatible"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20.19.4"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NPM_CONFIG_PRODUCTION = "false"
  NETLIFY = "true"
  NEXT_PUBLIC_NETLIFY = "true"

# Configuration des timeouts
[build.timeout]
  build = 900
  functions = 900

# Configuration DNS pour les domaines personnalisés
[[redirects]]
  from = "https://dlsolutionssarl.tech/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dlsolutionssarl.tech/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://daveandlucesolutions.com/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.daveandlucesolutions.com/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

# Configuration des en-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

 