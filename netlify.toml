[build]
  command = "npm run build:netlify:ultra-simple"
  publish = ".next"
  functions = "netlify/functions"

[build.processing]
  skip_processing = false

[build.environment]
  NODE_VERSION = "20.19.4"
  NPM_FLAGS = "--legacy-peer-deps"
  NODE_OPTIONS = "--max-old-space-size=4096"
  NEXT_TELEMETRY_DISABLED = "1"
  NPM_CONFIG_PRODUCTION = "false"
  NETLIFY = "true"
  NODE_ENV = "production"
  NEXT_PUBLIC_NETLIFY = "true"
  WEBPACK_SELF_FIXER = "true"
  DEBUG_SELF_REFERENCE_FIXER = "true"
  # Optimisations pour Netlify
  NEXT_SHARP_PATH = "/opt/buildhome/.npm-global/lib/node_modules/sharp"

# Optimisations de build
[build.optimization]
  bundle = true
  minify = true

# Configuration des timeouts
[build.timeout]
  build = 900
  functions = 900

# Configuration DNS pour les domaines personnalisés
[[redirects]]
  from = "https://dlsolutionssarl.tech/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.dlsolutionssarl.tech/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://daveandlucesolutions.com/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.daveandlucesolutions.com/*"
  to = "https://davyetlue.netlify.app/:splat"
  status = 301
  force = true

# Redirection pour le frontend
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Configuration des en-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Configuration de fallback pour le build
[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

 